<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百家 AI 獵手 | 尊爵多桌戰情中心 V3</title>
    <style>
        :root { --bg-dark: #0f172a; --panel-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --brand-cyan: #06b6d4; --banker-red: #ef4444; --player-blue: #3b82f6; --warning-amber: #f59e0b; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;}
        
        /* 隱藏登入，直接進入主畫面 */
        #login-screen { display: none; }
        
        #app-screen { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 1600px; }
        .header { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 20px; }
        .user-info { font-size: 14px; color: var(--text-muted); display: flex; align-items: center; gap: 10px; background: var(--panel-bg); padding: 8px 15px; border-radius: 20px; border: 1px solid #334155;}
        
        .control-bar { background: var(--panel-bg); padding: 15px 25px; border-radius: 12px; border: 1px solid #f59e0b; margin-bottom: 20px; width: 100%; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box;}
        select, input { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; }
        
        #grid-container { display: grid; gap: 20px; width: 100%; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); }
        
        .table-card { background: var(--panel-bg); border-radius: 12px; padding: 20px; border-top: 3px solid var(--brand-cyan); box-shadow: 0 4px 6px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 15px;}
        .table-card.active-attack { border-top: 3px solid var(--warning-amber); box-shadow: 0 0 15px rgba(245, 158, 11, 0.15); }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px;}
        .card-header h2 { margin: 0; font-size: 18px; color: #fff; }
        .profit-pos { color: #10b981; font-weight: bold; font-size: 18px;} .profit-neg { color: #ef4444; font-weight: bold; font-size: 18px;}
        
        .capital-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 15px; border-radius: 8px; font-size: 14px;}
        
        .status-box { text-align: center; padding: 15px; border-radius: 8px; background: #0f172a; font-size: 18px; font-weight: bold;}
        .status-box.warmup { color: var(--text-muted); }
        .status-box.scanning { color: #10b981; }
        .status-box.attacking { background: rgba(245, 158, 11, 0.1); color: var(--warning-amber); border: 1px solid var(--warning-amber); }
        .status-box.filter { color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.5); }
        
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; transition: 0.2s;}
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-player { background-color: var(--player-blue); } .btn-banker { background-color: var(--banker-red); }
        .btn-small { background-color: #334155; font-size: 14px; }
        
        .road-wrapper { background: #0f172a; padding: 10px; border-radius: 8px; overflow-x: auto; border: 1px solid #334155;}
        .six-road { display: grid; grid-template-rows: repeat(6, 26px); grid-auto-columns: 26px; grid-auto-flow: column; gap: 2px; }
        .road-cell { width: 26px; height: 26px; background: #1e293b; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; }
        .bead { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: white; }
        .bead.banker { background-color: var(--banker-red); } .bead.player { background-color: var(--player-blue); }
    </style>
</head>
<body>

    <div id="app-screen">
        <div class="header">
            <h1 style="margin:0; font-size: 24px; color: #f59e0b;">百家 AI 獵手 <span style="color:var(--text-muted); font-size:16px;">| 尊爵多桌戰情中心 V3</span></h1>
            <div class="user-info">
                <span style="color: #10b981;">● 本機獨立運算 (免連線)</span>
            </div>
        </div>

        <div class="control-bar">
            <div>
                <label style="color:var(--text-muted); margin-right:10px;">請選擇同時監控桌數：</label>
                <select id="table-count" onchange="initTables()">
                    <option value="1">1 桌</option>
                    <option value="2">2 桌</option>
                    <option value="3">3 桌</option>
                    <option value="4" selected>4 桌</option>
                    <option value="5">5 桌</option>
                    <option value="6">6 桌</option>
                </select>
            </div>
            <div style="font-size: 22px; font-weight: bold;">
                總淨損益: <span id="global-net-profit" style="color: #10b981;">$0</span>
            </div>
        </div>

        <div id="grid-container">
            <!-- 卡片動態生成區 -->
        </div>
    </div>

<script>
    // ==========================================
    // 💡 全新 V3 獨立運算核心 (多桌版)
    // ==========================================
    
    let tablesData = [];
    const MARTINGALE_STEPS = [1, 2, 4, 8, 16, 32, 64, 128]; // 八層倍投

    // 解析 80 種型態資料庫
    const PATTERNS_DB = {};
    const rawData = `
    (一)122112122(11212211)、122112211(22121122)、122112121(11212212)、122112212(22121121)
    (二)211221211(22121122)、211221122(11212211)、211221212(22121121)、211221121(11212212)
    (三)122111222(21222111)、122111111(12111222)、122111221(21222112)、122111112(12111221)
    (四)211222111(12111222)、211222222(21222111)、211222112(12111221)、211222221(21222112)
    (五)111211122(22222111)、111211211(11111222)、111211121(22222112)、111211212(11111221)
    (六)222122211(11111222)、222122122(22222111)、222122212(11111221)、222122121(22222112)
    (七)111221222(12121111)、111221111(21212222)、111221221(12121112)、111221112(21212221)
    (八)222112111(21212222)、222112222(12121111)、222112112(21212221)、222112221(12121112)
    (九)122122112(12212221)、122122221(21121112)、122122111(12212222)、122122222(21121111)
    (十)211211221(21121112)、211211112(12212221)、211211222(21121111)、211211111(12212222)
    (十一)112211222(21222111)、112211111(12111222)、112211221(21222112)、112211112(12111221)
    (十二)221122111(12111222)、221122222(21222111)、221122112(12111221)、221122221(21222112)
    (十三)121222211(12111222)、121222122(21222111)、121222212(12111221)、121222121(21222112)
    (十四)212111122(21222111)、212111211(12111222)、212111121(21222112)、212111212(12111221)
    (十五)112122112(22212221)、112122221(11121112)、112122111(22212222)、112122222(11121111)
    (十六)221211221(11121112)、221211112(22212221)、221211222(11121111)、221211111(22212222)
    (十七)121121211(11122122)、121121122(22211211)、121121212(11122121)、121121121(22211212)
    (十八)212212122(22211211)、212212211(11122122)、212212121(22211212)、212212212(11122121)
    (十九)112221112(12121121)、112221221(21212212)、112221111(12121122)、112221222(21212211)
    (二十)221112221(21212212)、221112112(12121121)、221112222(21212211)、221112111(12121122)
    `;
    const regex = /([12]{9})\(([12]{8})\)/g;
    let match;
    while ((match = regex.exec(rawData)) !== null) { PATTERNS_DB[match[1]] = match[2].split(''); }

    // 初始化桌次資料
    function initTables() {
        const count = parseInt(document.getElementById('table-count').value);
        const grid = document.getElementById('grid-container');
        grid.innerHTML = "";
        
        while(tablesData.length < count) {
            tablesData.push({ 
                id: tablesData.length + 1, 
                shoeData: [], 
                initialCapital: 25500, baseUnit: 100 
            });
        }
        tablesData = tablesData.slice(0, count);

        tablesData.forEach((table, index) => {
            const data = recalculateLogic(table);
            const currentBalance = table.initialCapital + data.netProfit;
            const div = document.createElement('div');
            div.className = `table-card ${data.state === 'ATTACKING' ? 'active-attack' : ''}`;
            div.id = `table-card-${index}`;
            
            div.innerHTML = `
                <div class="card-header">
                    <h2>🎯 桌次 ${table.id}</h2>
                    <div id="profit-${index}" class="${data.netProfit >= 0 ? 'profit-pos' : 'profit-neg'}">
                        ${data.netProfit >= 0 ? '+' : ''}$${data.netProfit.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}
                    </div>
                </div>
                <div class="capital-row">
                    <div>
                        <label style="color:var(--text-muted); font-size:12px; display:block;">設定初始本金</label>
                        <input type="number" id="capital-input-${index}" value="${table.initialCapital}" style="width:100px; padding:4px;" onchange="updateTableCapital(${index})">
                    </div>
                    <div style="text-align:right;">
                        <div style="color:var(--text-muted); font-size:12px;">單注基礎碼: <span id="baseunit-display-${index}">$${table.baseUnit}</span></div>
                        <div style="color:#fff;">餘額: <span id="balance-${index}">$${currentBalance.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}</span></div>
                    </div>
                </div>
                <div class="status-box ${data.state.toLowerCase()}" id="status-${index}">
                    ${renderStatusText(data)}
                </div>
                <div class="btn-group">
                    <button class="btn btn-player table-btn-${index}" onclick="inputResult(${index}, 1)">閒 (P)</button>
                    <button class="btn btn-banker table-btn-${index}" onclick="inputResult(${index}, 2)">莊 (B)</button>
                </div>
                <div class="btn-group">
                    <button class="btn btn-small table-btn-${index}" onclick="undo(${index})">↩ 退回一步</button>
                    <button class="btn btn-small table-btn-${index}" onclick="resetShoe(${index})">🗑️ 清空新局</button>
                </div>
                <div class="road-wrapper"><div class="six-road" id="road-${index}"></div></div>
            `;
            grid.appendChild(div);
            drawSixRoad(index);
        });
        updateGlobalProfit();
    }

    // 核心運算演算法 (100% 獨立，支援完美 Undo)
    function recalculateLogic(table) {
        let netProfit = 0;
        let state = 'WARMUP';
        let mStep = 0;
        let attackSeq = null;
        let recommend = null;

        for (let i = 0; i < table.shoeData.length; i++) {
            let res = table.shoeData[i].toString(); 

            if (state === 'ATTACKING' && recommend) {
                if (res === recommend.target) {
                    let payout = (res === '2') ? (recommend.bet * 0.95) : recommend.bet;
                    netProfit += payout;
                    state = 'SCANNING';
                    mStep = 0;
                    attackSeq = null;
                    recommend = null;
                } else {
                    netProfit -= recommend.bet;
                    mStep++;
                    if (mStep >= 8) {
                        state = 'SCANNING';
                        mStep = 0;
                        attackSeq = null;
                        recommend = null;
                    } else {
                        recommend.target = attackSeq[mStep];
                        recommend.bet = +(table.baseUnit * MARTINGALE_STEPS[mStep]).toFixed(2);
                        recommend.step = mStep + 1;
                    }
                }
            }

            if (state !== 'ATTACKING') {
                let currentHistory = table.shoeData.slice(0, i + 1).join('');
                if (currentHistory.length < 9) {
                    state = 'WARMUP';
                } else {
                    let last6 = currentHistory.slice(-6);
                    if (last6 === "121212" || last6 === "212121") {
                        state = 'FILTER_SKIP';
                    } else {
                        let last9 = currentHistory.slice(-9);
                        if (PATTERNS_DB[last9]) {
                            state = 'ATTACKING';
                            attackSeq = PATTERNS_DB[last9];
                            mStep = 0;
                            recommend = {
                                target: attackSeq[0],
                                bet: +(table.baseUnit * MARTINGALE_STEPS[0]).toFixed(2),
                                step: 1
                            };
                        } else {
                            state = 'SCANNING';
                        }
                    }
                }
            }
        }
        return { netProfit, state, recommend, step: mStep, currentLen: table.shoeData.length };
    }

    // 渲染狀態文字
    function renderStatusText(data) {
        if(data.state === 'ATTACKING') return `⚡ [${data.recommend.step}/8攬] 目標: ${data.recommend.target === '1' ? '閒(P)' : '莊(B)'} | 下注: $${data.recommend.bet.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}`;
        if(data.state === 'SCANNING') return `🟢 智能掃描中...`;
        if(data.state === 'FILTER_SKIP') return `🛡️ 迴避三單跳 (觀望)`;
        return `⏳ 暖局中 (${data.currentLen}/9手)`;
    }

    // 更新各桌介面
    function updateTableUI(tIndex) {
        const table = tablesData[tIndex];
        const data = recalculateLogic(table);
        const currentBalance = table.initialCapital + data.netProfit;
        
        document.getElementById(`profit-${tIndex}`).innerText = `${data.netProfit >= 0 ? '+' : ''}$${data.netProfit.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}`;
        document.getElementById(`profit-${tIndex}`).className = data.netProfit >= 0 ? 'profit-pos' : 'profit-neg';
        document.getElementById(`balance-${tIndex}`).innerText = `$${currentBalance.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}`;
        
        const cardEl = document.getElementById(`table-card-${tIndex}`);
        const statusBox = document.getElementById(`status-${tIndex}`);
        
        cardEl.className = `table-card ${data.state === 'ATTACKING' ? 'active-attack' : ''}`;
        statusBox.className = `status-box ${data.state.toLowerCase()}`;
        statusBox.innerHTML = renderStatusText(data);
        
        drawSixRoad(tIndex);
        updateGlobalProfit();
    }

    function updateTableCapital(tIndex) {
        if(tablesData[tIndex].shoeData.length > 0) {
            alert("請在清空新局後再調整本金！");
            document.getElementById(`capital-input-${tIndex}`).value = tablesData[tIndex].initialCapital;
            return;
        }
        let val = parseFloat(document.getElementById(`capital-input-${tIndex}`).value);
        if(val && val > 0) {
            tablesData[tIndex].initialCapital = val;
            tablesData[tIndex].baseUnit = Number((val / 255).toFixed(2));
            document.getElementById(`baseunit-display-${tIndex}`).innerText = `$${tablesData[tIndex].baseUnit}`;
            updateTableUI(tIndex);
        }
    }

    function drawSixRoad(tIndex) {
        const data = tablesData[tIndex].shoeData;
        const grid = document.getElementById(`road-${tIndex}`);
        grid.innerHTML = "";
        let cols = Math.max(15, Math.ceil(data.length / 6)); 
        grid.style.gridTemplateColumns = `repeat(${cols}, 26px)`;
        for(let c=0; c<cols; c++) {
            for(let r=0; r<6; r++) {
                let idx = c * 6 + r;
                let cell = document.createElement("div");
                cell.className = "road-cell";
                if(idx < data.length) {
                    let bead = document.createElement("div");
                    bead.className = `bead ${data[idx] === 1 ? 'player' : 'banker'}`;
                    bead.innerText = data[idx] === 1 ? '閒' : '莊';
                    cell.appendChild(bead);
                }
                grid.appendChild(cell);
            }
        }
        grid.parentElement.scrollLeft = grid.parentElement.scrollWidth;
    }

    function inputResult(tIndex, res) { tablesData[tIndex].shoeData.push(res); updateTableUI(tIndex); }
    function undo(tIndex) { if(tablesData[tIndex].shoeData.length === 0) return; tablesData[tIndex].shoeData.pop(); updateTableUI(tIndex); }
    function resetShoe(tIndex) { tablesData[tIndex].shoeData = []; updateTableUI(tIndex); }

    function updateGlobalProfit() {
        let total = 0;
        tablesData.forEach(t => { total += recalculateLogic(t).netProfit; });
        const el = document.getElementById('global-net-profit');
        el.innerText = `$${total.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}`;
        el.style.color = total >= 0 ? '#10b981' : '#ef4444';
    }

    // 載入即啟動
    window.onload = initTables;
</script>
</body>
</html>
