<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百家 AI 獵手 | Baccarat AI Hunter</title>
    <style>
        :root { --bg-dark: #0f172a; --panel-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --brand-cyan: #06b6d4; --banker-red: #ef4444; --player-blue: #3b82f6; --warning-amber: #f59e0b; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .logo-icon { width: 48px; height: 48px; animation: pulse-glow 2s infinite alternate; }
        @keyframes pulse-glow { 0% { filter: drop-shadow(0 0 5px var(--brand-cyan)); } 100% { filter: drop-shadow(0 0 15px var(--brand-cyan)); } }
        .header h1 { margin: 0; font-size: 28px; letter-spacing: 2px; background: linear-gradient(90deg, #fff, var(--brand-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .container { display: grid; grid-template-columns: 300px 1fr; gap: 20px; max-width: 1000px; width: 1000px; }
        .panel { background-color: var(--panel-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-top: 3px solid var(--panel-bg); }
        .panel.active-attack { border-top: 3px solid var(--warning-amber); box-shadow: 0 0 20px rgba(245, 158, 11, 0.2); }
        h2 { font-size: 18px; margin-top: 0; margin-bottom: 15px; color: var(--text-muted); border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .capital-section { margin-bottom: 20px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        .input-group { display: flex; flex-direction: column; margin-bottom: 10px; }
        .input-group label { font-size: 14px; color: var(--text-muted); margin-bottom: 5px; }
        .input-group input { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; font-size: 16px; outline: none; }
        .stats-row { display: flex; justify-content: space-between; font-size: 14px; margin-top: 5px; }
        .profit-pos { color: #10b981; } .profit-neg { color: #ef4444; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn { padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; color: white; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-player { background-color: var(--player-blue); } .btn-banker { background-color: var(--banker-red); }
        .btn-small { background-color: #334155; padding: 10px; font-size: 14px; }
        .status-header { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 20px; }
        .status-box { flex: 1; background: #0f172a; padding: 15px; border-radius: 8px; text-align: center; }
        .status-box .label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .status-box .value { font-size: 24px; font-weight: bold; }
        .value.scanning { color: #10b981; } .value.attacking { color: var(--warning-amber); } .value.warmup { color: var(--text-muted); }
        .attack-panel { display: none; background: rgba(245, 158, 11, 0.1); border: 1px solid var(--warning-amber); border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .attack-panel.show { display: block; }
        .attack-header { display: flex; justify-content: space-between; font-size: 14px; color: var(--warning-amber); margin-bottom: 15px; }
        .attack-target { font-size: 42px; font-weight: bold; margin-bottom: 10px; }
        .attack-amount { font-size: 24px; font-weight: bold; color: #fff; background: #0f172a; padding: 10px 20px; border-radius: 30px; display: inline-block;}
        .target-banker { color: var(--banker-red); } .target-player { color: var(--player-blue); }
        .road-container { background: #0f172a; padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid #334155;}
        .six-road { display: grid; grid-template-rows: repeat(6, 30px); grid-auto-columns: 30px; grid-auto-flow: column; gap: 2px; }
        .road-cell { width: 30px; height: 30px; background: #1e293b; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; }
        .bead { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: white; }
        .bead.banker { background-color: var(--banker-red); } .bead.player { background-color: var(--player-blue); }
        .log-panel { margin-top: 20px; max-width: 1000px; width: 1000px; background: var(--panel-bg); border-radius: 12px; padding: 20px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 13px; box-sizing: border-box;}
        .log-entry { margin-bottom: 5px; color: var(--text-muted); }
        .log-entry.info { color: #60a5fa; } .log-entry.alert { color: var(--warning-amber); } .log-entry.success { color: #34d399; } .log-entry.error { color: #f87171; }
        .disclaimer { margin-top: 20px; max-width: 1000px; padding: 15px; font-size: 12px; color: #64748b; line-height: 1.5; text-align: justify; border-top: 1px dashed #334155; }
    </style>
</head>
<body>
    <div class="header">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle><path d="M22 12h-4"></path><path d="M6 12H2"></path><path d="M12 6V2"></path><path d="M12 22v-4"></path><circle cx="12" cy="12" r="3" fill="#06b6d4"></circle>
        </svg>
        <h1>百家 AI 獵手</h1>
    </div>
    <div class="container">
        <div class="panel">
            <h2>資金與風控</h2>
            <div class="capital-section">
                <div class="input-group">
                    <label>設定初始本金</label>
                    <input type="number" id="start-capital" value="25500" onchange="updateCapital()">
                </div>
                <div class="stats-row"><span>當前餘額:</span><span id="current-balance" style="color: #fff;">$25,500</span></div>
                <div class="stats-row"><span>總淨損益:</span><span id="total-profit" class="profit-pos">$0</span></div>
                <div class="stats-row" style="margin-top: 10px; color: var(--text-muted);"><span>單注基礎碼:</span><span id="base-unit">$100</span></div>
            </div>
            <h2 style="margin-top: 20px;">請輸入</h2>
            <div class="btn-group">
                <button class="btn btn-player" id="btn-p" onclick="inputResult(1)">閒 (P)</button>
                <button class="btn btn-banker" id="btn-b" onclick="inputResult(2)">莊 (B)</button>
            </div>
            <div class="btn-group">
                <button class="btn btn-small" id="btn-undo" onclick="undo()">退回一步</button>
                <button class="btn btn-small" id="btn-reset" onclick="resetShoe()">清空新局</button>
            </div>
        </div>
        <div class="panel" id="main-panel">
            <h2>AI 狀態機監控</h2>
            <div class="status-header">
                <div class="status-box"><div class="label">當前局數</div><div class="value" id="game-count">0</div></div>
                <div class="status-box"><div class="label">系統狀態</div><div class="value warmup" id="sys-state">⏳ 暖局中 (1-11)</div></div>
            </div>
            <div class="attack-panel" id="attack-panel">
                <div class="attack-header"><span>⚡ 演算法鎖定目標</span><span id="martingale-step">八纜進度: 1/8</span></div>
                <div style="font-size: 14px; color: var(--text-muted); margin-bottom: 5px;">下一注請下達指令</div>
                <div class="attack-target" id="target-display">--</div>
                <div class="attack-amount" id="bet-amount">$0</div>
            </div>
            <h2 style="margin-top: 20px;">大數據六珠路</h2>
            <div class="road-container"><div class="six-road" id="six-road-grid"></div></div>
        </div>
    </div>
    <div class="log-panel" id="log-window"><div class="log-entry">[系統] 獵手系統初始化完成。雲端伺服器連線正常。</div></div>
    <div class="disclaimer">
        <strong>【免責與風控聲明】</strong><br>本系統為機率量化輔助工具。經 10,000 靴真實大數據極限回測，取得高達 99.7% 之過關率。然歷史數據不代表未來獲利保證。任何機率遊戲皆存在極端偏差風險，請嚴守止損紀律，切勿重倉押注。使用者須對自身決策負完全責任。
    </div>

<script>
    let shoeData = []; let initialCapital = 25500; let baseUnit = 100;

    function updateCapital() {
        if(shoeData.length > 0) { alert("請在清空新局後再調整本金！"); document.getElementById('start-capital').value = initialCapital; return; }
        let val = parseFloat(document.getElementById('start-capital').value);
        if(val && val >= 255) { initialCapital = val; baseUnit = Math.floor(val / 255); updateUIState({netProfit: 0}); log(`[系統] 本金已更新，單注基礎碼為 $${baseUnit}`); }
    }

    async function inputResult(res) { shoeData.push(res); renderRoad(); await fetchCloudBrain(); }
    async function undo() { if (shoeData.length === 0) return; shoeData.pop(); renderRoad(); await fetchCloudBrain(); }
    async function resetShoe() { shoeData = []; renderRoad(); await fetchCloudBrain(); log(`[系統] 盤面已清空，開始新局。`); }

    async function fetchCloudBrain() {
        const btns = document.querySelectorAll('.btn'); btns.forEach(b => b.disabled = true);
        document.getElementById('sys-state').innerText = "☁️ 雲端運算中..."; document.getElementById("game-count").innerText = shoeData.length;

        try {
            const response = await fetch('/api/hunter', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ shoeData: shoeData, baseUnit: baseUnit }) });
            const data = await response.json(); updateUIState(data);
        } catch (e) {
            log(`[錯誤] 無法連線至雲端伺服器！`, "error"); document.getElementById('sys-state').innerText = "⚠️ 網路斷線";
        }
        btns.forEach(b => b.disabled = false);
    }

    function updateUIState(data) {
        let currentBalance = initialCapital + (data.netProfit || 0); document.getElementById('current-balance').innerText = `$${currentBalance.toLocaleString()}`;
        let profitEl = document.getElementById('total-profit'); profitEl.innerText = `${data.netProfit >= 0 ? '+' : ''}${(data.netProfit || 0).toLocaleString()}`;
        profitEl.className = data.netProfit >= 0 ? 'profit-pos' : 'profit-neg'; document.getElementById('base-unit').innerText = `$${baseUnit.toLocaleString()}`;
        if(data.logMsg) log(data.logMsg, data.logType);

        let stateEl = document.getElementById("sys-state"); let panelEl = document.getElementById("main-panel"); let atkPanel = document.getElementById("attack-panel");

        if (data.state === "WARMUP") { stateEl.innerHTML = "⏳ 暖局中 (1-11)"; stateEl.className = "value warmup"; panelEl.className = "panel"; atkPanel.classList.remove("show"); }
        else if (data.state === "SCANNING") { stateEl.innerHTML = "🟢 智能掃描中"; stateEl.className = "value scanning"; panelEl.className = "panel"; atkPanel.classList.remove("show"); }
        else if (data.state === "STOPPED") { stateEl.innerHTML = "🛑 已達50局 (停止掃描)"; stateEl.className = "value warmup"; panelEl.className = "panel"; atkPanel.classList.remove("show"); }
        else if (data.state === "ATTACKING") {
            stateEl.innerHTML = "⚔️ 八纜攻擊中"; stateEl.className = "value attacking"; panelEl.className = "panel active-attack"; atkPanel.classList.add("show");
            document.getElementById("martingale-step").innerText = `八纜進度: ${data.step + 1}/8`;
            let targetDisplay = document.getElementById("target-display");
            if (data.target === "1") { targetDisplay.innerHTML = "閒 (P)"; targetDisplay.className = "attack-target target-player"; } 
            else { targetDisplay.innerHTML = "莊 (B)"; targetDisplay.className = "attack-target target-banker"; }
            document.getElementById("bet-amount").innerText = `$${data.betAmount.toLocaleString()}`;
        }
    }

    function renderRoad() {
        const grid = document.getElementById("six-road-grid"); grid.innerHTML = ""; let cols = Math.ceil(Math.max(30, shoeData.length) / 6);
        for(let c=0; c<cols; c++) {
            for(let r=0; r<6; r++) {
                let idx = c * 6 + r; let cell = document.createElement("div"); cell.className = "road-cell";
                if(idx < shoeData.length) {
                    let bead = document.createElement("div"); bead.className = `bead ${shoeData[idx] === 1 ? 'player' : 'banker'}`;
                    bead.innerText = shoeData[idx] === 1 ? '閒' : '莊'; cell.appendChild(bead);
                }
                grid.appendChild(cell);
            }
        }
    }
    renderRoad();
</script>
</body>
</html>
