<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百家 AI 獵手 | 尊爵多桌版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-dark: #0f172a; --panel-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --brand-cyan: #06b6d4; --banker-red: #ef4444; --player-blue: #3b82f6; --warning-amber: #f59e0b; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;}
        .header { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1400px; margin-bottom: 20px; }
        .control-bar { background: var(--panel-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--brand-cyan); margin-bottom: 20px; width: 100%; max-width: 1400px; display: flex; gap: 15px; align-items: center;}
        select, input { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; font-size: 16px; outline: none; }
        
        /* 動態網格系統：根據選擇桌數調整排版 */
        #grid-container { display: grid; gap: 20px; width: 100%; max-width: 1400px; }
        
        .table-panel { background: var(--panel-bg); border-radius: 12px; padding: 15px; border: 1px solid #334155; display: flex; flex-direction: column;}
        .table-panel h3 { margin: 0 0 10px 0; color: var(--brand-cyan); font-size: 16px; border-bottom: 1px solid #334155; padding-bottom: 5px;}
        .btn-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; color: white; cursor: pointer; }
        .btn-player { background-color: var(--player-blue); } .btn-banker { background-color: var(--banker-red); }
        .btn-small { background-color: #334155; font-size: 12px;}
        
        .status-box { background: #0f172a; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 10px; font-size: 14px;}
        .attack-mode { border: 1px solid var(--warning-amber); background: rgba(245, 158, 11, 0.1); color: var(--warning-amber); font-weight: bold;}
        .road-container { background: #0f172a; padding: 5px; border-radius: 6px; overflow-x: auto; flex-grow: 1;}
        .bead { width: 16px; height: 16px; border-radius: 50%; display: inline-block; margin: 1px; font-size: 10px; text-align: center; line-height: 16px; color: white;}
        .bead.banker { background-color: var(--banker-red); } .bead.player { background-color: var(--player-blue); }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="margin:0; font-size: 24px; color: var(--brand-cyan);">百家 AI 獵手 | 尊爵戰情中心</h1>
        <div id="total-net-profit" style="font-size: 20px; font-weight: bold; color: #10b981;">總淨損益: $0</div>
    </div>

    <div class="control-bar">
        <label>同時監控桌數：</label>
        <select id="table-count" onchange="renderTables()">
            <option value="1">1 桌</option>
            <option value="2">2 桌</option>
            <option value="3">3 桌</option>
            <option value="4" selected>4 桌</option>
            <option value="5">5 桌</option>
            <option value="6">6 桌</option>
        </select>
        <label style="margin-left:20px;">單桌基礎碼：</label>
        <input type="number" id="base-unit" value="100" style="width: 80px;" onchange="updateBaseUnit()">
    </div>

    <div id="grid-container"></div>

<script>
    // ==========================================
    // 🔑 請填寫金鑰 (與 index.html 相同)
    // ==========================================
    const myProjectUrl = 'https://eqkjwyebucsywiuvkdmp.supabase.co'; 
    const myApiKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxa2p3eWVidWNzeXdpdXZrZG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTk0NTYsImV4cCI6MjEwMDg5NTQ1Nn0.bsLDBZ7IXBa-KPTZUfy3WMkPIgPMJ57465fIxaBghfY';
    
    // 多桌狀態管理 (陣列)
    let tablesData = [];
    let globalBaseUnit = 100;

    function updateBaseUnit() {
        globalBaseUnit = parseInt(document.getElementById('base-unit').value) || 100;
        tablesData.forEach(t => { t.netProfit = 0; }); // 切換基碼重置損益
        updateTotalProfit();
    }

    function renderTables() {
        const count = parseInt(document.getElementById('table-count').value);
        const grid = document.getElementById('grid-container');
        
        // 依照桌數動態改變 CSS 排版
        grid.style.gridTemplateColumns = `repeat(${count <= 3 ? count : 3}, 1fr)`;
        
        grid.innerHTML = "";
        
        // 保留已存在的桌次資料，新增缺失的
        while(tablesData.length < count) {
            tablesData.push({ id: tablesData.length + 1, shoeData: [], state: "WARMUP", netProfit: 0, target: null, betAmount: 0 });
        }
        tablesData = tablesData.slice(0, count);

        tablesData.forEach((table, index) => {
            const div = document.createElement('div');
            div.className = 'table-panel';
            div.innerHTML = `
                <h3>桌次 ${table.id} | 損益: <span id="profit-${index}" style="color:${table.netProfit >= 0 ? '#10b981' : '#ef4444'}">$${table.netProfit}</span></h3>
                
                <div class="status-box ${table.state === 'ATTACKING' ? 'attack-mode' : ''}" id="status-${index}">
                    ${table.state === 'ATTACKING' ? `⚡ 攻擊目標: ${table.target === '1' ? '閒' : '莊'} | 金額: $${table.betAmount}` : (table.state === 'SCANNING' ? '🟢 智能掃描中' : '⏳ 暖局中')}
                </div>
                
                <div class="btn-group">
                    <button class="btn btn-player" onclick="inputResult(${index}, 1)">閒 (P)</button>
                    <button class="btn btn-banker" onclick="inputResult(${index}, 2)">莊 (B)</button>
                </div>
                <div class="btn-group">
                    <button class="btn btn-small" onclick="undo(${index})">退回</button>
                    <button class="btn btn-small" onclick="resetShoe(${index})">清空</button>
                </div>
                
                <div class="road-container" id="road-${index}"></div>
            `;
            grid.appendChild(div);
            drawRoad(index);
        });
        updateTotalProfit();
    }

    async function inputResult(tIndex, res) { 
        tablesData[tIndex].shoeData.push(res); 
        drawRoad(tIndex); 
        await fetchCloudBrain(tIndex); 
    }
    async function undo(tIndex) { 
        if(tablesData[tIndex].shoeData.length === 0) return; 
        tablesData[tIndex].shoeData.pop(); 
        drawRoad(tIndex); 
        await fetchCloudBrain(tIndex); 
    }
    async function resetShoe(tIndex) { 
        tablesData[tIndex].shoeData = []; 
        tablesData[tIndex].netProfit = 0; 
        drawRoad(tIndex); 
        await fetchCloudBrain(tIndex); 
    }

    async function fetchCloudBrain(tIndex) {
        const table = tablesData[tIndex];
        try {
            const response = await fetch('/api/hunter', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ shoeData: table.shoeData, baseUnit: globalBaseUnit }) 
            });
            const data = await response.json();
            
            // 更新該桌狀態
            table.state = data.state;
            table.netProfit = data.netProfit || 0;
            table.target = data.target;
            table.betAmount = data.betAmount;
            
            // 局部重新渲染狀態區塊 (不閃爍)
            document.getElementById(`profit-${tIndex}`).innerText = `$${table.netProfit}`;
            document.getElementById(`profit-${tIndex}`).style.color = table.netProfit >= 0 ? '#10b981' : '#ef4444';
            
            const statusBox = document.getElementById(`status-${tIndex}`);
            if(data.state === 'ATTACKING') {
                statusBox.className = "status-box attack-mode";
                statusBox.innerHTML = `⚡ 攻擊目標: ${data.target === '1' ? '閒' : '莊'} | 金額: $${data.betAmount}`;
            } else {
                statusBox.className = "status-box";
                statusBox.innerHTML = data.state === 'SCANNING' ? '🟢 智能掃描中' : '⏳ 暖局中';
            }
            updateTotalProfit();
        } catch (e) { console.error("API Error", e); }
    }

    function updateTotalProfit() {
        const total = tablesData.reduce((sum, t) => sum + t.netProfit, 0);
        const el = document.getElementById('total-net-profit');
        el.innerText = `總淨損益: $${total}`;
        el.style.color = total >= 0 ? '#10b981' : '#ef4444';
    }

    function drawRoad(tIndex) {
        const data = tablesData[tIndex].shoeData;
        const container = document.getElementById(`road-${tIndex}`);
        container.innerHTML = "";
        data.forEach(res => {
            const b = document.createElement('div');
            b.className = `bead ${res === 1 ? 'player' : 'banker'}`;
            b.innerText = res === 1 ? '閒' : '莊';
            container.appendChild(b);
        });
    }

    // 初始化載入
    renderTables();
</script>
</body>
</html>
